<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 — ESCAPE ROOM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="/admin/theme" class="admin-entry" title="관리자 페이지">
      <i class="fas fa-user-shield"></i><span>관리자</span>
    </a>
    <a href="/" class="brand">
      <span class="brand-mark"><i class="fas fa-key"></i></span>
      ESCAPE ROOM
    </a>
    <button type="button" class="nav-toggle" aria-label="메뉴"><i class="fas fa-bars"></i></button>
    <nav class="nav">
      <a href="/">홈</a>
      <a href="/popular">인기 테마</a>
      <a href="/reservation">예약하기</a>
    </nav>
  </div>
</header>

<main class="container">
  <h1 class="page-title"><i class="fas fa-user" style="color:var(--accent);margin-right:10px;"></i>마이페이지</h1>
  <p class="page-subtitle" id="my-greeting">내 예약을 조회하고 수정·삭제할 수 있습니다.</p>

  <div class="table-container">
    <table class="table">
      <thead>
        <tr>
          <th style="width:80px;">번호</th>
          <th>테마</th>
          <th style="width:140px;">날짜</th>
          <th style="width:100px;">시간</th>
          <th style="width:220px;text-align:right;">관리</th>
        </tr>
      </thead>
      <tbody id="reservation-table-body"></tbody>
    </table>
  </div>
  <div id="reservation-empty" class="empty d-none">예약 내역이 없습니다. <a href="/reservation" style="color: var(--accent);">지금 예약하기</a></div>
</main>

<script src="/js/nav.js"></script>
<script src="/js/api.js"></script>
<script src="/js/my-reservations.js"></script>
</body>
</html>
